name: Build Test Tracker APK (120 FPS Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android 15 Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release-Optimized 120 FPS APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK to Test-Tracker.apk
        run: cp app/build/outputs/apk/release/app-release.apk Test-Tracker.apk

      - name: Upload Test-Tracker.apk
        uses: actions/upload-artifact@v4
        with:
          name: Test-Tracker-APK
          path: Test-Tracker.apk
          retention-days: 90
